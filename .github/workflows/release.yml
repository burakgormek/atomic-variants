on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    if: needs.release-please.outputs.releases_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - id: npm_check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Rust Code
        id: check_rust
        if: steps.npm_check.outputs.already_published != 'true'
        run: |
          if [ -f "Cargo.toml" ]; then
            echo "has_rust=true" >> $GITHUB_OUTPUT
          else
            echo "has_rust=false" >> $GITHUB_OUTPUT
          fi

      - name: Install WASI target
        if: steps.check_rust.outputs.has_rust == 'true' && steps.npm_check.outputs.already_published != 'true'
        run: rustup target add wasm32-wasip1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.npm_check.outputs.already_published != 'true'
        run: bun install --frozen-lockfile

      - name: Build package
        if: steps.npm_check.outputs.already_published != 'true'
        run: bun run build

      - name: Publish package
        if: steps.npm_check.outputs.already_published != 'true'
        run: |
          bun pm pack --filename $PWD/package.tgz
          npm publish package.tgz
